name: Testes

# Roda a suíte de testes do jogo automaticamente a cada push no main e a cada
# pull request. Serve para pegar regressão sem ninguém precisar lembrar de
# rodar os testes na mão.
#
# Para rodar o mesmo comando localmente, veja brport_vs/COMO_RODAR.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes-godot:
    name: Godot headless
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      # A versão do Godot vive num arquivo só, na raiz. O hook de arranque de
      # sessão (.claude/hooks/session-start.sh) lê o mesmo arquivo — antes
      # dele existir, a receita do CLAUDE.md baixava a 4.6.1 e o CI rodava a
      # 4.6.3, de modo que a sessão testava numa versão e o PR era barrado
      # noutra. Precisa ser um passo, e não `env:`, porque o bloco `env` do
      # job é avaliado antes do checkout — o arquivo ainda não existe lá.
      - name: Ler a versão do Godot
        run: echo "GODOT_VERSION=$(tr -d '[:space:]' < .godot-version)" >> "$GITHUB_ENV"

      - name: Reaproveitar o Godot já baixado
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Baixar o Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-bin
          curl -sSL --retry 3 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          chmod +x ~/godot-bin/"Godot_v${GODOT_VERSION}-stable_linux.x86_64"

      - name: Importar o projeto
        run: |
          set -euo pipefail
          ~/godot-bin/"Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless --path brport_vs --import

      - name: Rodar os testes
        run: |
          set -euo pipefail
          ~/godot-bin/"Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless --path brport_vs --script res://tests/run_tests.gd \
            2>&1 | tee /tmp/saida.txt

          # O script sai com código != 0 quando alguma asserção falha, mas um
          # erro de compilação do GDScript pode sair com 0 sem rodar nada —
          # por isso exigimos também a linha final de sucesso.
          if ! grep -q "TODOS OS TESTES PASSARAM" /tmp/saida.txt; then
            echo "::error::A suíte não chegou ao fim com sucesso (veja a saída acima)."
            exit 1
          fi

      - name: Rodar o teste de design
        # Confere o que a suíte de lógica não vê: se os props caem em cima do
        # que o gerador do mapa desenhou, se a ordem dos nós respeita a
        # profundidade isométrica e se a interface cabe na tela sem se
        # sobrepor. Depende de `art/porto_mapa_ancoras.json`, que sai junto
        # com os mapas — regerar o mapa sem versionar a tabela quebra aqui.
        run: |
          set -euo pipefail
          ~/godot-bin/"Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless --path brport_vs --script res://tests/teste_design.gd \
            2>&1 | tee /tmp/design.txt

          if ! grep -q "DESIGN OK" /tmp/design.txt; then
            echo "::error::O teste de design encontrou algo fora do lugar (veja a saída acima)."
            exit 1
          fi

      - name: Rodar o teste de áudio
        # Ninguém — nem o CI, nem a máquina de quem desenvolve — consegue OUVIR
        # os sons: não há placa de som. Este passo cobre exatamente o que dá
        # para provar sem ouvir: o arquivo carrega, o bus existe, o sinal certo
        # pede o som certo, e a prioridade impede quatro sinais do mesmo frame
        # de virarem quatro sons.
        run: |
          set -euo pipefail
          ~/godot-bin/"Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless --path brport_vs --script res://tests/teste_audio.gd \
            2>&1 | tee /tmp/audio.txt

          if ! grep -q "AUDIO OK" /tmp/audio.txt; then
            echo "::error::O encanamento de áudio está quebrado (veja a saída acima)."
            exit 1
          fi

      - name: Rodar o teste de fumaça
        # Item B4 do plano: cobre o que até aqui só o olho cobria. Instancia
        # TODAS as `.tscn` do projeto — inclusive as de `scenes/proto/`, que
        # nada no jogo carrega e por isso podiam apodrecer caladas —, confere
        # que todo ícone registrado em `Icones.gd` tem arquivo no disco, e
        # tranca a regra do save: outra versão é DESCARTADA, nunca adaptada.
        #
        # O ícone merece o passo próprio embora o `Icones.gd` use `preload`:
        # medido aqui, apagar um SVG do disco com o cache de import quente NÃO
        # derruba cena nenhuma — o Godot serve a cópia já importada em
        # `.godot/`. O defeito só aparece num clone novo, que é onde ninguém
        # está a olhar.
        run: |
          set -euo pipefail
          ~/godot-bin/"Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless --path brport_vs --script res://tests/teste_fumaca.gd \
            2>&1 | tee /tmp/fumaca.txt

          if ! grep -q "FUMACA OK" /tmp/fumaca.txt; then
            echo "::error::Alguma cena não abre, falta um ícone, ou o save migrou (veja a saída acima)."
            exit 1
          fi

      - name: Validar os assets do pipeline BRP
        # Confere o que sobreviveu ao render e chegou ao jogo: quadro, canal
        # alfa e — o que mais importa — que a projeção que gerou os PNGs é a
        # mesma que o mapa desenha. O validador do lado do Blender
        # (blender/validate_brp_assets.py) NÃO roda aqui: ele precisa do bpy,
        # que são ~1 GB de download, e o que ele cobre (âncora, apoio, volume
        # de seleção) só existe com a cena montada. Rodar à mão ao mexer nos
        # catálogos.
        run: |
          set -euo pipefail
          ~/godot-bin/"Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless --path brport_vs \
            --script res://scripts/validation/asset_validator.gd \
            2>&1 | tee /tmp/assets.txt

          if ! grep -q "ASSET OK" /tmp/assets.txt; then
            echo "::error::Algum asset do pipeline BRP está fora do contrato."
            exit 1
          fi

      - name: Conferir que os sons versionados batem com o gerador
        run: |
          set -euo pipefail
          python3 tools/gerar_sons.py brport_vs/audio/sfx >/dev/null
          if ! git diff --quiet -- brport_vs/audio; then
            echo "::error::Os WAV versionados não batem com tools/gerar_sons.py."
            git diff --stat -- brport_vs/audio
            exit 1
          fi

      - name: Conferir que a tabela de âncoras está em dia
        # A tabela é gerada pelo mesmo script que gera os mapas. Se alguém
        # mexer nas coordenadas do mundo e esquecer de versionar a tabela, o
        # teste de design passa a validar contra um porto que já não existe.
        run: |
          set -euo pipefail
          python3 tools/gerar_mapa_iso.py --sem-pieres --sem-coqueiros \
            --sem-predios --sem-pavimento brport_vs/art/porto_mapa_iso.svg >/dev/null
          python3 tools/gerar_mapa_iso.py --sem-pieres --sem-coqueiros \
            --sem-predios brport_vs/art/porto_mapa_iso_patio.svg >/dev/null
          if ! git diff --quiet -- brport_vs/art; then
            echo "::error::Os mapas ou as âncoras versionados não batem com o gerador."
            git diff --stat -- brport_vs/art
            exit 1
          fi

      - name: Conferir que a tabela de números está em dia
        # Os números do jogo viviam no GDD e nas constantes `# TUNING:`, e já
        # divergiram uma vez: o modelo da Fase 1 no GDD acumulava R$1.480
        # contra uma parcela de R$8.000, e ninguém notou até o playtest
        # (BR_Port_GDD_V7_ERRATA_ECONOMIA.md). Agora a tabela é gerada do
        # código e este passo reprova quem mexe num `# TUNING:` sem regerar.
        #
        # São dois programas de propósito. O despejo do Godot dá os valores
        # avaliados (inclusive os derivados, como TURNS_TOTAL); o gerador lê o
        # TEXTO, porque é dele que saem os comentários que dizem se o número
        # veio do GDD ou é TUNING. O --contra-godot cruza as duas leituras, de
        # modo que uma constante que o parser não entenda REPROVE em vez de
        # sumir da tabela em silêncio.
        run: |
          set -euo pipefail
          ~/godot-bin/"Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless --path brport_vs \
            --script res://tools/despejar_constantes.gd -- /tmp/constantes.json \
            2>&1 | tee /tmp/constantes.txt

          # A linha de sucesso, não o $?: um erro de compilação do GDScript
          # sai com 0 sem rodar nada.
          if ! grep -q "CONSTANTES OK" /tmp/constantes.txt; then
            echo "::error::O despejo das constantes do GameState não chegou ao fim."
            exit 1
          fi

          python3 tools/gerar_tabela_numeros.py --conferir \
            --contra-godot /tmp/constantes.json

      - name: Conferir o simulador de balanceamento
        # Rodada mínima só para garantir que a ferramenta continua funcionando
        # depois de mudanças no GameState — ela usa a API do jogo por fora e
        # quebraria em silêncio. Não julga o balanceamento, só que roda.
        run: |
          set -euo pipefail
          ~/godot-bin/"Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless --path brport_vs \
            --script res://tools/simular_balanceamento.gd -- 30 20260825 \
            /tmp/medicao.json \
            2>&1 | tee /tmp/sim.txt

          if ! grep -q "=== Leitura ===" /tmp/sim.txt; then
            echo "::error::O simulador não chegou ao fim (veja a saída acima)."
            exit 1
          fi

          # PARTIDA QUE NÃO TERMINA É REPROVAÇÃO, e até 01/09 não era: o
          # simulador imprimia "possível travamento" e seguia até à linha de
          # Leitura, que é a única que este passo procurava. O laço dele só
          # sabe resolver as fases `rival_offer` e `debt_payment`, e
          # `advance_turn()` retorna CALADO fora de `playing` — de modo que
          # uma fase nova no GameState faria as 30 partidas girarem até ao
          # limite de segurança e o CI passaria na mesma, com a medição toda
          # errada. Foi a razão de a tela de nomes do A4 ser overlay e não
          # fase; esta linha é para a próxima vez, em que ninguém se lembrar.
          if grep -q "possível travamento" /tmp/sim.txt; then
            echo "::error::Partidas não terminaram no simulador — alguma fase nova bloqueia o turno."
            exit 1
          fi

      - name: Conferir que o modelo das Parcelas 2 e 3 continua calibrado
        # O projetor tem de RECONSTRUIR a semana em regime que o simulador
        # acabou de medir, nos três perfis, antes de ter licença para falar das
        # fases seguintes. Isso torna este passo uma guarda de regressão de
        # verdade: mexer num `# TUNING:` de um jeito que desloque a economia
        # sem o modelo saber reprova aqui.
        #
        # A calibração aguenta as 30 partidas de fumaça porque a margem semanal
        # é média de muitos turnos — bem menos ruidosa do que a taxa de
        # vitória, que a estas alturas tem ±18 pontos de margem. Medido: os
        # três erros ficam abaixo de 2% com 30 partidas e abaixo de 1,2% com
        # 600.
        run: |
          set -euo pipefail
          python3 tools/projetar_parcelas.py \
            --medicao /tmp/medicao.json --constantes /tmp/constantes.json

  # ── A BUILD QUE SAI DAQUI E VAI PARA UM TELEFONE ──
  #
  # Item A1 do plano v3, e o único do plano ANTIGO que estava marcado para a
  # semana 6 e nunca foi feito. Até 02/09 o jogo nunca tinha corrido fora de um
  # contêiner: `export_presets.cfg` estava no `.gitignore` de `brport_vs/`, o CI
  # não exportava nada, e tudo o que se sabia sobre o comportamento dele num
  # telefone era dedução a partir do `gl_compatibility` e do retrato travado.
  #
  # POR QUE O APK SÓ SE CONSTRÓI AQUI: o contêiner de desenvolvimento não
  # alcança `dl.google.com` — o proxy de egresso responde 403 por política, e
  # está medido. Sem o SDK do Android não há `apksigner` nem `adb`, e o Godot
  # recusa o export. O runner do GitHub já traz o SDK e o JDK, então é aqui que
  # o telefone é servido. O export Web, esse, roda em qualquer lado e foi
  # verificado no contêiner antes deste job existir.
  #
  # Job SEPARADO da suíte de propósito: um export que quebre não pode apagar o
  # sinal dos testes, que é o que diz se o JOGO está bem.
  build-telefone:
    name: Export — APK e Web
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Ler a versão do Godot
        run: |
          V=$(tr -d '[:space:]' < .godot-version)
          echo "GODOT_VERSION=$V" >> "$GITHUB_ENV"
          # As definições do editor vivem num arquivo com a versão MAIOR.MENOR
          # no nome (editor_settings-4.6.tres), não a de correção.
          echo "GODOT_MINOR=${V%.*}" >> "$GITHUB_ENV"

      - name: Reaproveitar o Godot e os templates já baixados
        id: cache-export
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-export-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Baixar o Godot e os templates de export
        if: steps.cache-export.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-bin
          curl -sSL --retry 3 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          chmod +x ~/godot-bin/"Godot_v${GODOT_VERSION}-stable_linux.x86_64"

          # ~1,2 GB. É a razão de o cache cobrir os dois juntos: sem ele, cada
          # corrida gastaria mais tempo a baixar do que a exportar.
          curl -sSL --retry 3 -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p /tmp/tpl "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          cp /tmp/tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Preparar a assinatura de debug e apontar o SDK
        # O APK vai ASSINADO EM DEBUG, e é de propósito: o alvo deste item é um
        # telefone do Bruno, não a loja. Chave de release exigiria um segredo no
        # repositório para um APK que ninguém publica — e o `export_presets.cfg`
        # versionado deixa os campos de keystore VAZIOS justamente para nenhuma
        # chave passar por ele.
        run: |
          set -euo pipefail
          KEYDIR="$HOME/.local/share/godot/keystores"
          mkdir -p "$KEYDIR"
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore "$KEYDIR/debug.keystore" \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -deststoretype pkcs12

          # Uma corrida em vazio para o Godot escrever as definições padrão do
          # editor; depois só se corrigem os dois caminhos. Escrever o arquivo
          # inteiro à mão prenderia esta receita ao formato de uma versão.
          ~/godot-bin/"Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless --quit --editor --path brport_vs 2>/dev/null || true

          CFG="$HOME/.config/godot/editor_settings-${GODOT_MINOR}.tres"
          test -f "$CFG" || { echo "::error::não achei $CFG"; exit 1; }
          sed -i "s|^export/android/android_sdk_path = .*|export/android/android_sdk_path = \"${ANDROID_SDK_ROOT}\"|" "$CFG"
          sed -i "s|^export/android/debug_keystore = .*|export/android/debug_keystore = \"${KEYDIR}/debug.keystore\"|" "$CFG"
          grep -E '^export/android/(android_sdk_path|debug_keystore|java_sdk_path)' "$CFG"

      - name: Importar o projeto
        run: |
          set -euo pipefail
          ~/godot-bin/"Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless --path brport_vs --import

      - name: Exportar a build Web
        run: |
          set -euo pipefail
          mkdir -p build/web
          ~/godot-bin/"Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless --path brport_vs --export-release "Web" ../build/web/index.html
          test -s build/web/index.pck || { echo "::error::o .pck do Web saiu vazio."; exit 1; }
          ls -la build/web

      - name: Exportar o APK
        run: |
          set -euo pipefail
          mkdir -p build/android
          ~/godot-bin/"Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless --path brport_vs --export-debug "Android" ../build/android/brport.apk

          # Um APK de zero byte é o que sai quando o export falha a meio sem
          # devolver código de erro. Conferir o tamanho é a diferença entre um
          # artefato e uma promessa.
          test -s build/android/brport.apk || { echo "::error::o APK saiu vazio."; exit 1; }
          ls -la build/android
          echo "APK: $(du -h build/android/brport.apk | cut -f1)"

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: brport-apk
          path: build/android/brport.apk
          if-no-files-found: error

      # SOBE MESMO QUE O APK TENHA FALHADO. Na primeira corrida o Web
      # exportou bem e não chegou a artefato nenhum, porque o passo do APK
      # falhou antes e levou os dois uploads atrás — perdeu-se a única build
      # que tinha funcionado. Um passo que deu certo tem de entregar o que
      # produziu, independentemente do que veio depois.
      - name: Guardar a build Web
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: brport-web
          path: build/web/
          if-no-files-found: error
