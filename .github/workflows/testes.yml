name: Testes

# Roda a suíte de testes do jogo automaticamente a cada push no main e a cada
# pull request. Serve para pegar regressão sem ninguém precisar lembrar de
# rodar os testes na mão.
#
# Para rodar o mesmo comando localmente, veja brport_vs/COMO_RODAR.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes-godot:
    name: Godot headless
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      # A versão do Godot vive num arquivo só, na raiz. O hook de arranque de
      # sessão (.claude/hooks/session-start.sh) lê o mesmo arquivo — antes
      # dele existir, a receita do CLAUDE.md baixava a 4.6.1 e o CI rodava a
      # 4.6.3, de modo que a sessão testava numa versão e o PR era barrado
      # noutra. Precisa ser um passo, e não `env:`, porque o bloco `env` do
      # job é avaliado antes do checkout — o arquivo ainda não existe lá.
      - name: Ler a versão do Godot
        run: echo "GODOT_VERSION=$(tr -d '[:space:]' < .godot-version)" >> "$GITHUB_ENV"

      - name: Reaproveitar o Godot já baixado
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Baixar o Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-bin
          curl -sSL --retry 3 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          chmod +x ~/godot-bin/"Godot_v${GODOT_VERSION}-stable_linux.x86_64"

      - name: Importar o projeto
        run: |
          set -euo pipefail
          ~/godot-bin/"Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless --path brport_vs --import

      - name: Rodar os testes
        run: |
          set -euo pipefail
          ~/godot-bin/"Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless --path brport_vs --script res://tests/run_tests.gd \
            2>&1 | tee /tmp/saida.txt

          # O script sai com código != 0 quando alguma asserção falha, mas um
          # erro de compilação do GDScript pode sair com 0 sem rodar nada —
          # por isso exigimos também a linha final de sucesso.
          if ! grep -q "TODOS OS TESTES PASSARAM" /tmp/saida.txt; then
            echo "::error::A suíte não chegou ao fim com sucesso (veja a saída acima)."
            exit 1
          fi

      - name: Rodar o teste de design
        # Confere o que a suíte de lógica não vê: se os props caem em cima do
        # que o gerador do mapa desenhou, se a ordem dos nós respeita a
        # profundidade isométrica e se a interface cabe na tela sem se
        # sobrepor. Depende de `art/porto_mapa_ancoras.json`, que sai junto
        # com os mapas — regerar o mapa sem versionar a tabela quebra aqui.
        run: |
          set -euo pipefail
          ~/godot-bin/"Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless --path brport_vs --script res://tests/teste_design.gd \
            2>&1 | tee /tmp/design.txt

          if ! grep -q "DESIGN OK" /tmp/design.txt; then
            echo "::error::O teste de design encontrou algo fora do lugar (veja a saída acima)."
            exit 1
          fi

      - name: Rodar o teste de áudio
        # Ninguém — nem o CI, nem a máquina de quem desenvolve — consegue OUVIR
        # os sons: não há placa de som. Este passo cobre exatamente o que dá
        # para provar sem ouvir: o arquivo carrega, o bus existe, o sinal certo
        # pede o som certo, e a prioridade impede quatro sinais do mesmo frame
        # de virarem quatro sons.
        run: |
          set -euo pipefail
          ~/godot-bin/"Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless --path brport_vs --script res://tests/teste_audio.gd \
            2>&1 | tee /tmp/audio.txt

          if ! grep -q "AUDIO OK" /tmp/audio.txt; then
            echo "::error::O encanamento de áudio está quebrado (veja a saída acima)."
            exit 1
          fi

      - name: Validar os assets do pipeline BRP
        # Confere o que sobreviveu ao render e chegou ao jogo: quadro, canal
        # alfa e — o que mais importa — que a projeção que gerou os PNGs é a
        # mesma que o mapa desenha. O validador do lado do Blender
        # (blender/validate_brp_assets.py) NÃO roda aqui: ele precisa do bpy,
        # que são ~1 GB de download, e o que ele cobre (âncora, apoio, volume
        # de seleção) só existe com a cena montada. Rodar à mão ao mexer nos
        # catálogos.
        run: |
          set -euo pipefail
          ~/godot-bin/"Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless --path brport_vs \
            --script res://scripts/validation/asset_validator.gd \
            2>&1 | tee /tmp/assets.txt

          if ! grep -q "ASSET OK" /tmp/assets.txt; then
            echo "::error::Algum asset do pipeline BRP está fora do contrato."
            exit 1
          fi

      - name: Conferir que os sons versionados batem com o gerador
        run: |
          set -euo pipefail
          python3 tools/gerar_sons.py brport_vs/audio/sfx >/dev/null
          if ! git diff --quiet -- brport_vs/audio; then
            echo "::error::Os WAV versionados não batem com tools/gerar_sons.py."
            git diff --stat -- brport_vs/audio
            exit 1
          fi

      - name: Conferir que a tabela de âncoras está em dia
        # A tabela é gerada pelo mesmo script que gera os mapas. Se alguém
        # mexer nas coordenadas do mundo e esquecer de versionar a tabela, o
        # teste de design passa a validar contra um porto que já não existe.
        run: |
          set -euo pipefail
          python3 tools/gerar_mapa_iso.py --sem-pieres --sem-coqueiros \
            --sem-predios --sem-pavimento brport_vs/art/porto_mapa_iso.svg >/dev/null
          python3 tools/gerar_mapa_iso.py --sem-pieres --sem-coqueiros \
            --sem-predios brport_vs/art/porto_mapa_iso_patio.svg >/dev/null
          if ! git diff --quiet -- brport_vs/art; then
            echo "::error::Os mapas ou as âncoras versionados não batem com o gerador."
            git diff --stat -- brport_vs/art
            exit 1
          fi

      - name: Conferir que a tabela de números está em dia
        # Os números do jogo viviam no GDD e nas constantes `# TUNING:`, e já
        # divergiram uma vez: o modelo da Fase 1 no GDD acumulava R$1.480
        # contra uma parcela de R$8.000, e ninguém notou até o playtest
        # (BR_Port_GDD_V7_ERRATA_ECONOMIA.md). Agora a tabela é gerada do
        # código e este passo reprova quem mexe num `# TUNING:` sem regerar.
        #
        # São dois programas de propósito. O despejo do Godot dá os valores
        # avaliados (inclusive os derivados, como TURNS_TOTAL); o gerador lê o
        # TEXTO, porque é dele que saem os comentários que dizem se o número
        # veio do GDD ou é TUNING. O --contra-godot cruza as duas leituras, de
        # modo que uma constante que o parser não entenda REPROVE em vez de
        # sumir da tabela em silêncio.
        run: |
          set -euo pipefail
          ~/godot-bin/"Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless --path brport_vs \
            --script res://tools/despejar_constantes.gd -- /tmp/constantes.json \
            2>&1 | tee /tmp/constantes.txt

          # A linha de sucesso, não o $?: um erro de compilação do GDScript
          # sai com 0 sem rodar nada.
          if ! grep -q "CONSTANTES OK" /tmp/constantes.txt; then
            echo "::error::O despejo das constantes do GameState não chegou ao fim."
            exit 1
          fi

          python3 tools/gerar_tabela_numeros.py --conferir \
            --contra-godot /tmp/constantes.json

      - name: Conferir o simulador de balanceamento
        # Rodada mínima só para garantir que a ferramenta continua funcionando
        # depois de mudanças no GameState — ela usa a API do jogo por fora e
        # quebraria em silêncio. Não julga o balanceamento, só que roda.
        run: |
          set -euo pipefail
          ~/godot-bin/"Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless --path brport_vs \
            --script res://tools/simular_balanceamento.gd -- 30 20260825 \
            /tmp/medicao.json \
            2>&1 | tee /tmp/sim.txt

          if ! grep -q "=== Leitura ===" /tmp/sim.txt; then
            echo "::error::O simulador não chegou ao fim (veja a saída acima)."
            exit 1
          fi

      - name: Conferir que o modelo das Parcelas 2 e 3 continua calibrado
        # O projetor tem de RECONSTRUIR a semana em regime que o simulador
        # acabou de medir, nos três perfis, antes de ter licença para falar das
        # fases seguintes. Isso torna este passo uma guarda de regressão de
        # verdade: mexer num `# TUNING:` de um jeito que desloque a economia
        # sem o modelo saber reprova aqui.
        #
        # A calibração aguenta as 30 partidas de fumaça porque a margem semanal
        # é média de muitos turnos — bem menos ruidosa do que a taxa de
        # vitória, que a estas alturas tem ±18 pontos de margem. Medido: os
        # três erros ficam abaixo de 2% com 30 partidas e abaixo de 1,2% com
        # 600.
        run: |
          set -euo pipefail
          python3 tools/projetar_parcelas.py \
            --medicao /tmp/medicao.json --constantes /tmp/constantes.json
