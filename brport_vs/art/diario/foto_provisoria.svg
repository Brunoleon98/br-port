<svg xmlns="http://www.w3.org/2000/svg" width="480" height="340" viewBox="0 0 480 340">
  <!-- PROVISÓRIO (`docs/decisoes/067`): a foto colada na folha de rosto do
       diário. Céu, horizonte e mar em sépia, sem desenho nenhum de porto — a
       foto do porto de antigamente sai do ChatGPT
       (`art_lab/diario/BRIEFING.md`) e troca este arquivo; até lá, uma foto
       que não finge ser a arte, como o fundo provisório da tela inicial. -->
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e5a45"/>
      <stop offset="1" stop-color="#c9ad86"/>
    </linearGradient>
    <linearGradient id="mar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c8166"/>
      <stop offset="1" stop-color="#4f3e2f"/>
    </linearGradient>
    <radialGradient id="vinheta" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.55" stop-color="#2b2016" stop-opacity="0"/>
      <stop offset="1" stop-color="#2b2016" stop-opacity="0.55"/>
    </radialGradient>
  </defs>
  <rect width="480" height="200" fill="url(#ceu)"/>
  <rect y="200" width="480" height="140" fill="url(#mar)"/>
  <rect y="198" width="480" height="3" fill="#e2cfae" opacity="0.6"/>
  <rect width="480" height="340" fill="url(#vinheta)"/>
</svg>
