<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <!-- PROVISÓRIO (`docs/decisoes/066`): céu ao entardecer, horizonte e mar,
       sem desenho nenhum de porto. A ilustração de verdade sai do ChatGPT
       (`art_lab/tela_inicial/BRIEFING.md`) e troca este arquivo; até lá, um
       fundo que não finge ser a arte. -->
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1a26"/>
      <stop offset="0.45" stop-color="#1c3454"/>
      <stop offset="0.80" stop-color="#6a5a6e"/>
      <stop offset="1" stop-color="#e09a3a"/>
    </linearGradient>
    <linearGradient id="mar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c5d78"/>
      <stop offset="0.35" stop-color="#18405a"/>
      <stop offset="1" stop-color="#0b1f2e"/>
    </linearGradient>
    <radialGradient id="sol" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5c46a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f5c46a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#ceu)"/>
  <ellipse cx="540" cy="1080" rx="520" ry="150" fill="url(#sol)"/>
  <rect y="1080" width="1080" height="840" fill="url(#mar)"/>
  <rect y="1078" width="1080" height="4" fill="#f5c46a" opacity="0.55"/>
</svg>
