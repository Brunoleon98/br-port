# cego a uma casa, um bicho em cima de uma copa, a árvore parada ou a girar
# fora do pé, e uma copa a tapar um prop parado. Os da textura trocam o PNG no
# `TEXTURAS` e deixam as posições: é o defeito da peça re-renderizada MAIOR
# que só os pixels veem. O do contorno mexe no lote, e não no contorno —
# a guarda confere um contra o outro, e mexer no lote é o que a prova sem
