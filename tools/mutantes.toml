# ── A MATA DO MORRO E A RESTINGA DAS PONTAS (`127`) ────────────────────────
# As árvores são props que balançam, por cima do mapa, e o D47 pergunta o que
# isso arrisca: a cópia do jogo contra a tabela, a árvore maior do que o sítio
# dela (por cima da vila), a planta da restinga com o pé na areia, o contorno
# cego a uma casa, um bicho em cima de uma copa, a árvore parada ou a girar
# fora do pé, e uma copa a tapar um prop parado. Os da textura trocam o PNG no
# `TEXTURAS` e deixam as posições: é o defeito da peça re-renderizada MAIOR
# que só os pixels veem. O do contorno mexe no lote, e não no contorno —
# a guarda confere um contra o outro, e mexer no lote é o que a prova sem
# regerar o mapa. Ficam órfãos quando a mata é replantada; reescrevem-se
# contra a lista nova (`gerar_mapa_iso.py --lista-da-mata`).
