# coluna o contorno vem de 100 a 350 px acima, de casas e quintais de trás, e
# um lote mais alto continua abaixo dele. O defeito que a pergunta caça é o
# contorno CEGO nas colunas da casa — cinco colunas a 720 (`testes-e-guardas.md`).
# ⚠️ E O DO BICHO SOBREVIVEU DUAS VEZES, e a culpa era da GUARDA: lia a caixa
