# OS DEFEITOS QUE JÁ PROVARAM UMA GUARDA, e que continuam a prová-la.
#
# Quem lê isto é `tools/conferir_mutantes.py` (espera `MUTANTES OK`); quem
# decidiu a forma é `docs/decisoes/117`. Cada `[[mutante]]` é um defeito que
# alguém injetou à mão para provar uma guarda, ou um bug que chegou a existir,
# escrito como uma troca EXATA de texto num arquivo do jogo:
#
#   id      — o nome, curto, que o relatório e o `--so` usam
#   de      — a decisão (ou o dia) onde o defeito nasceu; é lá que está o porquê
#   o_que   — o defeito em uma frase, como o jogador ou a suíte o veria
#   alvo    — o arquivo que muda, a partir da raiz do repositório
#   antes   — o texto que existe hoje, e tem de existir UMA vez no alvo
#   depois  — o texto do defeito
#   todas   — opcional: troca TODAS as ocorrências (o mutante de nome renomeia o
#             nome, não a linha — `testes-e-guardas.md`, `095`)
#   reprova — suíte = "trecho do rótulo da asserção que TEM de reprovar"
#
# ⚠️ O `antes` É UM CONTRATO COM O CÓDIGO. Quem reescrever a linha vê a
# ferramenta reprovar por «mutante órfão», e reescreve o defeito contra a forma
# nova — com `--explorar`, que diz quem o apanha AGORA. Apagar a entrada é
# apagar a prova; só se apaga o defeito que deixou de poder existir, e diz-se
# porquê no commit.
#
# Literais TOML entre aspas simples: nada se escapa, e o tab do GDScript entra
# como tab. O `'''` seguido de quebra de linha come essa quebra.

